name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Préparer le projet
        run: |
          mkdir www
          rsync -a --exclude=www --exclude=.git --exclude=.github ./ www/
          npm init -y
          npm i @capacitor/core @capacitor/cli @capacitor/android
          npx cap init TahirCagnotte com.tahir.cagnotte --web-dir=www
          npx cap add android
          npx cap sync android
      - name: Build
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
